<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e86042">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<title>小Y提词器</title>
<style>
  :root{
    --bg:#000;
    --panel:#1c1c1e;
    --panel-2:#2c2c2e;
    --text-main:#fff;
    --text-dim:#9a9a9e;
    --accent:#e86042;

    --coral:#e86042;
    --navy:#211955;
    --pink:#f7c9e0;
    --pink-dark:#f264aa;
    --yellow:#ffd34d;
    --cream:#fff6ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    overflow:hidden;
  }
  #app{position:fixed; inset:0;}

  /* ---------- 编辑视图（小Y 品牌） ---------- */
  #editorView{
    position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--cream); color:var(--navy);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    overflow-y:auto; -webkit-user-select:auto;
  }
  #editorHeader{
    padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;
    display:flex; align-items:center; gap:12px;
    background:var(--coral); color:#fff;
    border-radius:0 0 22px 22px;
    margin-top:calc(env(safe-area-inset-top) * -1);
  }
  #editorHeader .mascot{
    width:44px; height:44px; border-radius:14px; flex:none;
    border:2.5px solid var(--navy); background:var(--pink);
    object-fit:cover; display:block;
  }
  #editorHeader h1{font-size:21px; margin:0; font-weight:800; letter-spacing:.5px;}
  #editorHeader span{font-size:12px; color:rgba(255,255,255,.85); display:block; margin-top:2px;}

  #scriptInput{
    flex:1; min-height:160px; margin:16px 16px 0; padding:14px; border-radius:18px;
    border:2.5px solid var(--navy); outline:none;
    background:#fff; color:var(--navy); font-size:17px; line-height:1.7;
    resize:none; -webkit-user-select:text; user-select:text;
  }
  #scriptInput::placeholder{color:#b9b3d6;}

  .settingsPanel{margin:14px 16px 0; background:#fff; border:2.5px solid var(--navy); border-radius:18px; padding:12px 14px;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:9px 0;}
  .row + .row{border-top:1.5px dashed #e3ddf5;}
  .row label{font-size:14px; color:var(--navy); font-weight:600;}
  .row input[type=range]{flex:1; margin-left:14px; accent-color:var(--pink-dark);}
  .seg{display:flex; gap:6px;}
  .seg button{
    border:2px solid var(--navy); background:#fff; color:var(--navy); font-size:13px; font-weight:700;
    padding:6px 12px; border-radius:20px;
  }
  .seg button.active{background:var(--yellow); color:var(--navy);}
  .colorDot{width:24px; height:24px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 0 2px var(--navy);}
  .colorDot.active{box-shadow:0 0 0 2px var(--coral);}

  .startRow{display:flex; gap:10px; margin:16px 16px;}
  .startRow button{
    flex:1; padding:15px; border:2.5px solid var(--navy); border-radius:24px;
    font-size:16px; font-weight:800; color:var(--navy);
  }
  #startBtn{background:var(--pink);}
  #startCameraBtn{background:var(--yellow);}
  #hint{font-size:12px; color:#8c81b3; text-align:center; margin:0 16px 14px; line-height:1.6;}

  /* ---------- 提词视图 ---------- */
  #prompterView{position:absolute; inset:0; display:none; overflow:hidden; background:#000;}
  #camPreview{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:none; z-index:0;}
  #camPreview.mirrored{transform:scaleX(-1);}
  #textClip{position:absolute; inset:0; overflow:hidden;}
  #textWrap{position:absolute; left:0; right:0; will-change:transform;}
  #textContent{
    padding:0 8%; font-size:34px; line-height:1.6; text-align:center; white-space:pre-wrap;
    word-break:break-word; color:#fff;
  }
  #textContent.overlayMode{background:rgba(0,0,0,.5);}

  #topBar{
    position:absolute; top:0; left:0; right:0; padding-top:env(safe-area-inset-top);
    display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background:linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
    transition:opacity .25s; z-index:5;
  }
  #topBar button{
    border:none; background:rgba(255,255,255,.14); color:#fff; font-size:13px;
    padding:8px 12px; border-radius:20px; white-space:nowrap;
  }
  #topBar button.on{background:var(--accent);}
  #topBar .spacer{flex:1;}

  #recordBar{
    position:absolute; top:calc(env(safe-area-inset-top) + 58px); left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; z-index:6; transition:opacity .25s;
  }
  #recordBtn{border:none; border-radius:22px; padding:10px 18px; background:rgba(255,59,48,.85); color:#fff; font-size:14px; font-weight:600;}
  #recordBtn.recording{background:#ff3b30; animation:pulse 1.1s infinite;}
  #recordBtn:disabled{opacity:.5;}
  #recordTimer{color:#fff; font-size:13px; background:rgba(0,0,0,.4); padding:4px 10px; border-radius:10px;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.5;}100%{opacity:1;}}

  #playBtn{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px); transform:translateX(-50%);
    width:64px; height:64px; border-radius:50%; border:none; background:rgba(255,255,255,.16);
    color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center;
    transition:opacity .25s; z-index:5;
  }
  #progressBar{
    position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.12); z-index:5;
  }
  #progressFill{height:100%; width:0%; background:var(--accent);}

  #countdown{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:120px; font-weight:700; color:#fff; z-index:10; background:#000;
  }
  #countdown.overlayMode{background:rgba(0,0,0,.35);}

  #reviewOverlay{
    position:absolute; inset:0; background:rgba(0,0,0,.92); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  #reviewVideo{max-width:100%; max-height:48vh; border-radius:12px; background:#000;}
  #saveHint{color:#e9e4f7; font-size:13px; line-height:1.7; text-align:center; margin:0 6px;}
  #reviewActions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  #reviewActions button{border:none; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:700; background:var(--panel-2); color:#fff;}
  #saveVideoBtn{background:#34c759; color:#fff;}
  #retakeBtn{background:var(--yellow); color:var(--navy);}

  .hidden{display:none !important;}
  .faded{opacity:0; pointer-events:none;}
</style>
</head>
<body>
<div id="app">

  <!-- 编辑视图 -->
  <div id="editorView">
    <div id="editorHeader">
      <img class="mascot" src="icon-192.png" alt="小Y">
      <div>
        <h1>小Y提词器</h1>
        <span>离线可用 · 边录像边读稿</span>
      </div>
    </div>
    <textarea id="scriptInput" placeholder="在这里粘贴或输入你的稿子……"></textarea>

    <div class="settingsPanel">
      <div class="row">
        <label>字号</label>
        <input type="range" id="fontSizeRange" min="20" max="72" step="1">
      </div>
      <div class="row">
        <label>速度</label>
        <input type="range" id="speedRange" min="10" max="160" step="2">
      </div>
      <div class="row">
        <label>颜色</label>
        <div class="seg" id="colorSeg">
          <span class="colorDot" data-color="#ffffff" style="background:#fff"></span>
          <span class="colorDot" data-color="#ffe066" style="background:#ffe066"></span>
          <span class="colorDot" data-color="#5ee07a" style="background:#5ee07a"></span>
          <span class="colorDot" data-color="#7ac7ff" style="background:#7ac7ff"></span>
        </div>
      </div>
      <div class="row">
        <label>镜像（配合提词器镜面支架）</label>
        <div class="seg">
          <button id="mirrorXBtn" data-m="x">水平</button>
          <button id="mirrorYBtn" data-m="y">垂直</button>
        </div>
      </div>
      <div class="row">
        <label>屏幕常亮</label>
        <div class="seg">
          <button id="wakeLockBtn">开启</button>
        </div>
      </div>
    </div>

    <div class="startRow">
      <button id="startBtn">仅看稿子</button>
      <button id="startCameraBtn">边录像边读稿</button>
    </div>
    <p id="hint">「仅看稿子」完全离线可用。「边录像边读稿」会用本机摄像头+麦克风一边拍摄一边显示滚动稿子，首次使用需允许摄像头/麦克风权限，且必须通过 https 网址打开（本地直接双击文件无法调用摄像头）。</p>
  </div>

  <!-- 提词视图 -->
  <div id="prompterView">
    <video id="camPreview" autoplay playsinline muted></video>
    <div id="textClip">
      <div id="textWrap"><div id="textContent"></div></div>
    </div>
    <div id="topBar">
      <button id="backBtn">← 编辑</button>
      <div class="spacer"></div>
      <button id="flipCameraBtn" class="hidden">🔄 摄像头</button>
      <button id="fontMinus">A-</button>
      <button id="fontPlus">A+</button>
      <button id="speedMinus">速度-</button>
      <button id="speedPlus">速度+</button>
      <button id="resetBtn">重来</button>
      <button id="hideBarBtn">隐藏</button>
    </div>
    <div id="recordBar" class="hidden">
      <button id="recordBtn" disabled>● 开始录制</button>
      <span id="recordTimer">00:00</span>
    </div>
    <button id="playBtn">▶</button>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="countdown">3</div>

    <div id="reviewOverlay" class="hidden">
      <video id="reviewVideo" controls playsinline></video>
      <p id="saveHint">iPhone 出于系统限制，网页无法「自动」写入相册。<br>点下方绿色按钮，在弹出的菜单里选「存储视频」即可保存。</p>
      <div id="reviewActions">
        <button id="saveVideoBtn">存储到相册</button>
        <button id="retakeBtn">重新录制</button>
        <button id="discardBtn">放弃并返回</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "teleprompter_state_v1";
  var defaults = {
    text: "",
    fontSize: 34,
    speed: 40,       // px / 秒
    color: "#ffffff",
    mirrorX: false,
    mirrorY: false,
    wakeLock: false
  };
  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return Object.assign({}, defaults, JSON.parse(raw));
    }catch(e){}
    return Object.assign({}, defaults);
  }
  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }, 200);
  }

  // ---------- DOM ----------
  var editorView = document.getElementById("editorView");
  var prompterView = document.getElementById("prompterView");
  var scriptInput = document.getElementById("scriptInput");
  var fontSizeRange = document.getElementById("fontSizeRange");
  var speedRange = document.getElementById("speedRange");
  var colorSeg = document.getElementById("colorSeg");
  var mirrorXBtn = document.getElementById("mirrorXBtn");
  var mirrorYBtn = document.getElementById("mirrorYBtn");
  var wakeLockBtn = document.getElementById("wakeLockBtn");
  var startBtn = document.getElementById("startBtn");
  var startCameraBtn = document.getElementById("startCameraBtn");

  var camPreview = document.getElementById("camPreview");
  var textClip = document.getElementById("textClip");
  var textWrap = document.getElementById("textWrap");
  var textContent = document.getElementById("textContent");
  var topBar = document.getElementById("topBar");
  var backBtn = document.getElementById("backBtn");
  var flipCameraBtn = document.getElementById("flipCameraBtn");
  var fontMinus = document.getElementById("fontMinus");
  var fontPlus = document.getElementById("fontPlus");
  var speedMinus = document.getElementById("speedMinus");
  var speedPlus = document.getElementById("speedPlus");
  var resetBtn = document.getElementById("resetBtn");
  var hideBarBtn = document.getElementById("hideBarBtn");
  var recordBar = document.getElementById("recordBar");
  var recordBtn = document.getElementById("recordBtn");
  var recordTimer = document.getElementById("recordTimer");
  var playBtn = document.getElementById("playBtn");
  var progressFill = document.getElementById("progressFill");
  var countdownEl = document.getElementById("countdown");
  var reviewOverlay = document.getElementById("reviewOverlay");
  var reviewVideo = document.getElementById("reviewVideo");
  var saveVideoBtn = document.getElementById("saveVideoBtn");
  var retakeBtn = document.getElementById("retakeBtn");
  var discardBtn = document.getElementById("discardBtn");

  // ---------- 初始化编辑视图 ----------
  scriptInput.value = state.text;
  fontSizeRange.value = state.fontSize;
  speedRange.value = state.speed;
  updateColorSeg();
  updateMirrorBtns();
  updateWakeLockBtn();

  scriptInput.addEventListener("input", function(){
    state.text = scriptInput.value;
    saveState();
  });
  fontSizeRange.addEventListener("input", function(){
    state.fontSize = parseInt(fontSizeRange.value, 10);
    applyTextStyle();
    saveState();
  });
  speedRange.addEventListener("input", function(){
    state.speed = parseInt(speedRange.value, 10);
    saveState();
  });
  colorSeg.addEventListener("click", function(e){
    var t = e.target.closest(".colorDot");
    if(!t) return;
    state.color = t.getAttribute("data-color");
    updateColorSeg();
    applyTextStyle();
    saveState();
  });
  mirrorXBtn.addEventListener("click", function(){
    state.mirrorX = !state.mirrorX;
    updateMirrorBtns(); applyMirror(); saveState();
  });
  mirrorYBtn.addEventListener("click", function(){
    state.mirrorY = !state.mirrorY;
    updateMirrorBtns(); applyMirror(); saveState();
  });
  wakeLockBtn.addEventListener("click", function(){
    state.wakeLock = !state.wakeLock;
    updateWakeLockBtn(); saveState();
    if(state.wakeLock) requestWakeLock(); else releaseWakeLock();
  });

  function updateColorSeg(){
    var dots = colorSeg.querySelectorAll(".colorDot");
    dots.forEach(function(d){
      d.classList.toggle("active", d.getAttribute("data-color") === state.color);
    });
  }
  function updateMirrorBtns(){
    mirrorXBtn.classList.toggle("active", state.mirrorX);
    mirrorYBtn.classList.toggle("active", state.mirrorY);
  }
  function updateWakeLockBtn(){
    wakeLockBtn.textContent = state.wakeLock ? "已开启" : "开启";
    wakeLockBtn.classList.toggle("active", state.wakeLock);
  }

  startBtn.addEventListener("click", function(){
    if(!scriptInput.value.trim()){ scriptInput.focus(); return; }
    enterPrompter(false);
  });
  startCameraBtn.addEventListener("click", function(){
    if(!scriptInput.value.trim()){ scriptInput.focus(); return; }
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      alert("当前页面无法使用摄像头（可能不是通过 https 打开的，或浏览器不支持）。请用部署后的网址打开本工具再试。");
      return;
    }
    enterPrompter(true);
  });

  // ---------- 提词逻辑 ----------
  var cameraMode = false;
  var playing = false;
  var rafId = null;
  var lastTs = 0;
  var posY = 0;       // textWrap 的 translateY
  var startY = 0;      // 文本起始位置（可见区域顶部）
  var endY = 0;        // 文本滚动结束位置（文本完全移出顶部）
  var barAutoHideTimer = null;

  function applyTextStyle(){
    textContent.style.fontSize = state.fontSize + "px";
    textContent.style.color = state.color;
  }
  function applyMirror(){
    if(cameraMode){ textClip.style.transform = "none"; return; }
    var sx = state.mirrorX ? -1 : 1;
    var sy = state.mirrorY ? -1 : 1;
    textClip.style.transform = "scale(" + sx + "," + sy + ")";
  }

  function enterPrompter(useCamera){
    cameraMode = !!useCamera;
    editorView.style.display = "none";
    prompterView.style.display = "block";
    textContent.textContent = state.text;
    applyTextStyle();
    textContent.classList.toggle("overlayMode", cameraMode);
    countdownEl.classList.toggle("overlayMode", cameraMode);
    applyMirror();

    flipCameraBtn.classList.toggle("hidden", !cameraMode);
    recordBar.classList.toggle("hidden", !cameraMode);

    requestAnimationFrame(function(){
      var clipH = textClip.clientHeight;
      var contentH = textContent.scrollHeight;
      startY = clipH * 0.3;
      endY = -(contentH);
      posY = startY;
      setTranslate(posY);
      progressFill.style.width = "0%";
      showBar(true);
      if(!cameraMode){
        startCountdown(play);
      }
    });

    if(cameraMode){
      currentFacing = "user";
      startCameraPreview(currentFacing);
    }

    if(state.wakeLock) requestWakeLock();
  }

  function setTranslate(y){
    textWrap.style.transform = "translateY(" + y + "px)";
    var total = startY - endY;
    var done = total > 0 ? (startY - y) / total : 0;
    progressFill.style.width = Math.min(100, Math.max(0, done * 100)) + "%";
  }

  function startCountdown(onDone){
    var n = 3;
    countdownEl.textContent = n;
    countdownEl.style.display = "flex";
    var timer = setInterval(function(){
      n--;
      if(n <= 0){
        clearInterval(timer);
        countdownEl.style.display = "none";
        (onDone || play)();
      } else {
        countdownEl.textContent = n;
      }
    }, 800);
  }

  function play(){
    if(playing) return;
    playing = true;
    playBtn.textContent = "❚❚";
    lastTs = 0;
    rafId = requestAnimationFrame(tick);
    scheduleAutoHide();
  }
  function pause(){
    playing = false;
    playBtn.textContent = "▶";
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    clearTimeout(barAutoHideTimer);
    showBar(true);
  }
  function tick(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    posY -= state.speed * dt;
    if(posY <= endY){
      posY = endY;
      setTranslate(posY);
      pause();
      return;
    }
    setTranslate(posY);
    rafId = requestAnimationFrame(tick);
  }

  playBtn.addEventListener("click", function(){
    if(playing) pause(); else play();
  });
  resetBtn.addEventListener("click", function(){
    pause();
    posY = startY;
    setTranslate(posY);
  });
  function goBackToEditor(){
    if(recording) stopRecording();
    pause();
    stopCameraStream();
    releaseWakeLock();
    reviewOverlay.classList.add("hidden");
    if(recordedBlobUrl){ URL.revokeObjectURL(recordedBlobUrl); recordedBlobUrl = null; }
    recordedBlob = null;
    prompterView.style.display = "none";
    editorView.style.display = "flex";
  }
  backBtn.addEventListener("click", goBackToEditor);
  discardBtn.addEventListener("click", goBackToEditor);

  fontMinus.addEventListener("click", function(){ changeFont(-2); });
  fontPlus.addEventListener("click", function(){ changeFont(2); });
  speedMinus.addEventListener("click", function(){ changeSpeed(-10); });
  speedPlus.addEventListener("click", function(){ changeSpeed(10); });
  function changeFont(delta){
    state.fontSize = Math.max(20, Math.min(72, state.fontSize + delta));
    fontSizeRange.value = state.fontSize;
    applyTextStyle();
    saveState();
  }
  function changeSpeed(delta){
    state.speed = Math.max(10, Math.min(160, state.speed + delta));
    speedRange.value = state.speed;
    saveState();
  }

  // 控制栏显隐
  function showBar(show){
    topBar.classList.toggle("faded", !show);
    playBtn.classList.toggle("faded", !show);
    if(cameraMode) recordBar.classList.toggle("faded", !show);
  }
  hideBarBtn.addEventListener("click", function(){
    showBar(false);
  });
  function scheduleAutoHide(){
    clearTimeout(barAutoHideTimer);
    barAutoHideTimer = setTimeout(function(){
      if(playing) showBar(false);
    }, 2500);
  }

  // 点击正文区域：切换控制栏显示（不影响播放/暂停，播放暂停交给专门按钮）
  textClip.addEventListener("click", function(){
    var barHidden = topBar.classList.contains("faded");
    showBar(barHidden);
    if(playing) scheduleAutoHide();
  });

  // 暂停时手势拖动文本微调位置
  var dragging = false;
  var dragStartY = 0;
  var dragStartPos = 0;
  textClip.addEventListener("touchstart", function(e){
    if(playing) return;
    dragging = true;
    dragStartY = e.touches[0].clientY;
    dragStartPos = posY;
  }, {passive:true});
  textClip.addEventListener("touchmove", function(e){
    if(!dragging) return;
    var dy = e.touches[0].clientY - dragStartY;
    posY = Math.min(startY, Math.max(endY, dragStartPos + dy));
    setTranslate(posY);
  }, {passive:true});
  textClip.addEventListener("touchend", function(){
    dragging = false;
  });

  // ---------- 摄像头预览 ----------
  var mediaStream = null;
  var currentFacing = "user";

  function startCameraPreview(facing){
    if(mediaStream){
      mediaStream.getTracks().forEach(function(t){ t.stop(); });
      mediaStream = null;
    }
    recordBtn.disabled = true;
    var videoConstraints = {
      facingMode: facing,
      width: {ideal: 1920},
      height: {ideal: 1080},
      frameRate: {ideal: 30}
    };
    navigator.mediaDevices.getUserMedia({video: videoConstraints, audio: true}).then(function(stream){
      mediaStream = stream;
      currentFacing = facing;
      camPreview.srcObject = stream;
      camPreview.style.display = "block";
      camPreview.classList.toggle("mirrored", facing === "user");
      camPreview.play().catch(function(){});
      recordBtn.disabled = false;
    }).catch(function(err){
      alert("无法访问摄像头/麦克风，请在「设置 > Safari > 摄像头/麦克风」中允许访问后重试。(" + err.name + ")");
    });
  }
  function stopCameraStream(){
    if(mediaStream){
      mediaStream.getTracks().forEach(function(t){ t.stop(); });
      mediaStream = null;
    }
    camPreview.pause();
    camPreview.srcObject = null;
    camPreview.style.display = "none";
  }
  flipCameraBtn.addEventListener("click", function(){
    if(recording) return;
    startCameraPreview(currentFacing === "user" ? "environment" : "user");
  });

  // ---------- 录制 ----------
  var mediaRecorder = null;
  var recordedChunks = [];
  var recordedBlob = null;
  var recording = false;
  var recordTimerInterval = null;
  var recordSeconds = 0;
  var recordedBlobUrl = null;

  recordBtn.addEventListener("click", function(){
    if(recording){
      stopRecording();
      return;
    }
    if(!mediaStream) return;
    recordBtn.disabled = true;
    startCountdown(function(){
      recordBtn.disabled = false;
      beginRecording();
      posY = startY;
      setTranslate(posY);
      play();
    });
  });

  function beginRecording(){
    if(!mediaStream) return;
    recordedChunks = [];
    var mimeCandidates = ["video/mp4;codecs=h264,aac", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
    var mimeType = "";
    for(var i = 0; i < mimeCandidates.length; i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(mimeCandidates[i])){
        mimeType = mimeCandidates[i];
        break;
      }
    }
    var recorderOpts = {videoBitsPerSecond: 12000000, audioBitsPerSecond: 128000};
    if(mimeType) recorderOpts.mimeType = mimeType;
    try{
      mediaRecorder = new MediaRecorder(mediaStream, recorderOpts);
    }catch(e){
      alert("这台设备不支持录像：" + e.message);
      return;
    }
    mediaRecorder.ondataavailable = function(e){
      if(e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();
    recording = true;
    recordBtn.textContent = "■ 结束录制";
    recordBtn.classList.add("recording");
    flipCameraBtn.disabled = true;
    recordSeconds = 0;
    updateRecordTimer();
    recordTimerInterval = setInterval(function(){
      recordSeconds++;
      updateRecordTimer();
    }, 1000);
  }
  function updateRecordTimer(){
    var m = Math.floor(recordSeconds / 60);
    var s = recordSeconds % 60;
    recordTimer.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }
  function stopRecording(){
    if(mediaRecorder && recording){
      mediaRecorder.stop();
    }
    recording = false;
    recordBtn.textContent = "● 开始录制";
    recordBtn.classList.remove("recording");
    flipCameraBtn.disabled = false;
    clearInterval(recordTimerInterval);
    pause();
  }
  function handleRecordingStop(){
    if(!recordedChunks.length){
      alert("没有录制到内容，请重新录一次。");
      recordedBlob = null;
      return;
    }
    var mimeType = (mediaRecorder && mediaRecorder.mimeType) || "video/mp4";
    recordedBlob = new Blob(recordedChunks, {type: mimeType});
    recordedBlobUrl = URL.createObjectURL(recordedBlob);
    reviewVideo.src = recordedBlobUrl;
    reviewVideo.load();
    reviewOverlay.classList.remove("hidden");
  }
  saveVideoBtn.addEventListener("click", saveVideo);
  function saveVideo(){
    if(!recordedBlob) return;
    var ext = recordedBlob.type.indexOf("mp4") > -1 ? "mp4" : "webm";
    var file = new File([recordedBlob], "小Y提词器-" + recordSeconds + "秒." + ext, {type: recordedBlob.type});
    var canShareFiles = false;
    try{
      canShareFiles = !!(navigator.canShare && navigator.canShare({files: [file]}));
    }catch(e){ canShareFiles = false; }
    if(canShareFiles){
      navigator.share({files: [file], title: "小Y提词器录像"}).catch(function(err){
        // 用户手动取消分享面板是正常的（AbortError），不打扰；其它错误走兜底
        if(err && err.name !== "AbortError"){ downloadFallback(file); }
      });
    } else {
      downloadFallback(file);
    }
  }
  function downloadFallback(file){
    var a = document.createElement("a");
    a.href = recordedBlobUrl;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    alert("这台设备/浏览器不支持直接存相册。请长按上方视频画面，在弹出的系统菜单里选「存储视频」保存。");
  }
  retakeBtn.addEventListener("click", function(){
    reviewOverlay.classList.add("hidden");
    reviewVideo.pause();
    reviewVideo.removeAttribute("src");
    reviewVideo.load();
    if(recordedBlobUrl){ URL.revokeObjectURL(recordedBlobUrl); recordedBlobUrl = null; }
    recordedBlob = null;
    posY = startY;
    setTranslate(posY);
  });

  // ---------- Wake Lock ----------
  var wakeLockObj = null;
  function requestWakeLock(){
    if(!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function(wl){
      wakeLockObj = wl;
    }).catch(function(){});
  }
  function releaseWakeLock(){
    if(wakeLockObj){
      wakeLockObj.release().catch(function(){});
      wakeLockObj = null;
    }
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && state.wakeLock && prompterView.style.display === "block"){
      requestWakeLock();
    }
  });

})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").catch(function(){});
  });
}
</script>
</body>
